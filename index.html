<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی تعادل حیوانات</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="background"></div>
        <div class="fire"></div>
        <div class="seesaw">
            <div class="pivot"></div>
            <div class="left-side"></div>
            <div class="right-side"></div>
        </div>
        <div class="animal-queue left-queue">
            <img src="https://uploadkon.ir/uploads/ba0b19_25Elephant.png" class="animal" data-weight="5">
            <img src="https://uploadkon.ir/uploads/423919_25Cow.png" class="animal" data-weight="4">
            <img src="https://uploadkon.ir/uploads/f77119_25DALL·E-2025-03-20-01-39-38-A-cute-cartoon-fox-with-orange-fur-a-bushy-tail-and-a-friendly-smile-standing-on-a-transparent-background-copy.png" class="animal" data-weight="3">
        </div>
        <div class="animal-queue right-queue">
            <img src="https://uploadkon.ir/uploads/ede219_25DALL·E-2025-03-20-01-39-30-A-cute-cartoon-rabbit-with-large-ears-white-fur-and-a-happy-expression-standing-on-a-transparent-background-copy.png" class="animal" data-weight="2">
            <img src="https://uploadkon.ir/uploads/2a8a19_25Chicken.png" class="animal" data-weight="1">
        </div>
        <div class="balloon">🎈</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
