<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D City Maze - Benz-Style Cars (No Win Panel)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      font-family: Arial, sans-serif;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    /* Score Display */
    #scoreDisplay {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 1.5em;
      z-index: 5;
    }
    /* Game Over Overlay */
    #gameOverPopup {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 10;
    }
    #gameOverPopup button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1.2em;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="scoreDisplay">Score: 0</div>
    <div id="gameOverPopup">
      <div id="popupText" style="font-size: 3em;">Game Over</div>
      <button id="replayButton">Replay</button>
    </div>
  </div>
  
  <!-- Load Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ---------------- Global Time Start ----------------
    let startTime = Date.now();
    
    // ---------------- Scene, Camera, Renderer Setup ----------------
    const container = document.getElementById("container");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);
    
    const camera = new THREE.PerspectiveCamera(
      75,
      container.clientWidth / container.clientHeight,
      0.1,
      1000
    );
    camera.position.set(0, 40, 0);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);
    
    // ---------------- Lights ----------------
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(20, 40, 20);
    scene.add(directionalLight);
    
    // ---------------- Map Setup ----------------
    const cityMap = [
      "############################",
      "#............##............#",
      "#.####.#####.##.#####.####.#",
      "#o####.#####.##.#####.####o#",
      "#.####.#####.##.#####.####.#",
      "#..........................#",
      "#.####.##.########.##.####.#",
      "#.####.##.########.##.####.#",
      "#......##....##....##......#",
      "######.##### ## #####.######",
      "     #.##### ## #####.#     ",
      "     #.##          ##.#     ",
      "     #.## ###--### ##.#     ",
      "######.## #      # ##.######",
      "      .   #      #   .      ",
      "######.## #      # ##.######",
      "     #.## ######## ##.#     ",
      "     #.##          ##.#     ",
      "     #.## ######## ##.#     ",
      "######.## ######## ##.######",
      "#............##............#",
      "#.####.#####.##.#####.####.#",
      "#o####.#####.##.#####.####o#",
      "#...##................##...#",
      "###.##.##.########.##.##.###",
      "#......##....##....##......#",
      "############################"
    ];
    const tileSize = 5;
    const mapRows = cityMap.length;   // 26 rows
    const mapCols = cityMap[0].length;  // 28 columns
    
    // ---------------- Helper Functions ----------------
    function getGridCell(x, z) {
      const originX = - (mapCols * tileSize) / 2;
      const originZ = - (mapRows * tileSize) / 2;
      const col = Math.floor((x - originX) / tileSize);
      const row = Math.floor((z - originZ) / tileSize);
      return { row, col };
    }
    function isStreet(x, z) {
      const cell = getGridCell(x, z);
      if (cell.row < 0 || cell.row >= mapRows || cell.col < 0 || cell.col >= mapCols) {
        return false;
      }
      return cityMap[cell.row][cell.col] !== "#";
    }
    
    // ---------------- Create Buildings ----------------
    const cityGroup = new THREE.Group();
    const buildingMaterial = new THREE.MeshPhongMaterial({
      color: 0x0077be,
      opacity: 0.85,
      transparent: true,
      shininess: 150
    });
    for (let row = 0; row < mapRows; row++) {
      for (let col = 0; col < mapCols; col++) {
        if (cityMap[row][col] === "#") {
          const buildingHeight = tileSize * (2 + Math.random() * 3);
          const geometry = new THREE.BoxGeometry(tileSize, buildingHeight, tileSize);
          const building = new THREE.Mesh(geometry, buildingMaterial.clone());
          building.material.color.setHSL(Math.random() * 0.1 + 0.55, 0.8, 0.5);
          building.position.x = (col - mapCols / 2) * tileSize + tileSize / 2;
          building.position.z = (row - mapRows / 2) * tileSize + tileSize / 2;
          building.position.y = buildingHeight / 2;
          cityGroup.add(building);
    
          const edges = new THREE.EdgesGeometry(geometry);
          const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ffff });
          const outline = new THREE.LineSegments(edges, lineMaterial);
          outline.position.copy(building.position);
          cityGroup.add(outline);
        }
      }
    }
    scene.add(cityGroup);
    
    // ---------------- Create Streets & Neon Street Lines ----------------
    const streetWidth = mapCols * tileSize;
    const streetDepth = mapRows * tileSize;
    const streetGeometry = new THREE.PlaneGeometry(streetWidth, streetDepth);
    const streetMaterial = new THREE.MeshPhongMaterial({ color: 0x2a2a2a });
    const street = new THREE.Mesh(streetGeometry, streetMaterial);
    street.rotation.x = -Math.PI / 2;
    street.position.y = 0.01;
    scene.add(street);
    
    const streetLines = new THREE.Group();
    const originX = - (mapCols * tileSize) / 2;
    const originZ = - (mapRows * tileSize) / 2;
    const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });
    const margin = 0.5;
    // Draw neon lines based on connectivity.
    for (let row = 0; row < mapRows; row++) {
      for (let col = 0; col < mapCols; col++) {
        if (cityMap[row][col] !== "#") {
          const cx = originX + col * tileSize + tileSize / 2;
          const cz = originZ + row * tileSize + tileSize / 2;
          let points = [];
          const leftOpen = col > 0 && cityMap[row][col-1] !== "#";
          const rightOpen = col < mapCols-1 && cityMap[row][col+1] !== "#";
          if (leftOpen || rightOpen) {
            points.push(new THREE.Vector3(cx - tileSize/2 + margin, 0.05, cz));
            points.push(new THREE.Vector3(cx + tileSize/2 - margin, 0.05, cz));
          }
          const topOpen = row > 0 && cityMap[row-1][col] !== "#";
          const bottomOpen = row < mapRows-1 && cityMap[row+1][col] !== "#";
          if (topOpen || bottomOpen) {
            points.push(new THREE.Vector3(cx, 0.05, cz - tileSize/2 + margin));
            points.push(new THREE.Vector3(cx, 0.05, cz + tileSize/2 - margin));
          }
          if (points.length > 0) {
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const cellLine = new THREE.LineSegments(geometry, lineMaterial);
            streetLines.add(cellLine);
          }
        }
      }
    }
    scene.add(streetLines);
    
    // ---------------- Create Floor (Sidewalks) ----------------
    const floorGeometry = new THREE.PlaneGeometry(streetWidth, streetDepth);
    const floorMaterial = new THREE.MeshPhongMaterial({ color: 0x111111 });
    const floorMesh = new THREE.Mesh(floorGeometry, floorMaterial);
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.position.y = 0;
    scene.add(floorMesh);
    
    // ---------------- Create Enhanced Bitcoin Coins ----------------
    const coinsGroup = new THREE.Group();
    const coinGeometry = new THREE.CylinderGeometry(1, 1, 0.2, 32); // 2x bigger
    const coinMaterial = new THREE.MeshPhongMaterial({ 
      color: 0xffd700,
      emissive: 0xffd700,
      emissiveIntensity: 0.6,
      flatShading: true
    });
    function createCoin() {
      const coin = new THREE.Mesh(coinGeometry, coinMaterial);
      coin.rotation.x = 0; // keep flat
      const ringGeo = new THREE.RingGeometry(0.3, 0.5, 32);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.11;
      coin.add(ring);
      return coin;
    }
    for (let row = 0; row < mapRows; row++) {
      for (let col = 0; col < mapCols; col++) {
        if (cityMap[row][col] !== "#") {
          if (Math.random() < 0.1) {
            const coin = createCoin();
            coin.position.x = originX + col * tileSize + tileSize / 2;
            coin.position.z = originZ + row * tileSize + tileSize / 2;
            coin.position.y = 1;
            coinsGroup.add(coin);
          }
        }
      }
    }
    scene.add(coinsGroup);
    
    // ---------------- Create Benz-Style Car Model ----------------
    function createBenzCar() {
      const carGroup = new THREE.Group();
      
      // Car Body: Longer and elegant.
      const bodyGeometry = new THREE.BoxGeometry(3, 0.7, 6);
      const bodyMaterial = new THREE.MeshPhongMaterial({ color: 0xffff00, flatShading: true });
      const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
      body.position.y = 0.9;
      carGroup.add(body);
      
      // Car Roof/Cabin
      const roofGeometry = new THREE.BoxGeometry(2.5, 0.3, 4);
      const roofMaterial = new THREE.MeshPhongMaterial({ color: 0x333333, flatShading: true });
      const roof = new THREE.Mesh(roofGeometry, roofMaterial);
      roof.position.set(0, 1.4, 0);
      carGroup.add(roof);
      
      // Wheels
      const wheelGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
      const wheelMaterial = new THREE.MeshPhongMaterial({ color: 0x000000 });
      function addWheel(x, z) {
        const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(x, 0.5, z);
        carGroup.add(wheel);
      }
      addWheel(-1.2, -2.2);
      addWheel(1.2, -2.2);
      addWheel(-1.2, 2.2);
      addWheel(1.2, 2.2);
      
      // Headlights
      const headlightGeometry = new THREE.SphereGeometry(0.2, 16, 16);
      const headlightMaterial = new THREE.MeshPhongMaterial({ color: 0xffffff });
      function addHeadlight(x, z) {
        const headlight = new THREE.Mesh(headlightGeometry, headlightMaterial);
        headlight.position.set(x, 0.8, z);
        carGroup.add(headlight);
      }
      addHeadlight(-0.9, -3.1);
      addHeadlight(0.9, -3.1);
      
      return carGroup;
    }
    
    // ---------------- Create Player's Car (Benz-Style, Yellow) ----------------
    const playerCar = createBenzCar();
    // Place at the center of the maze.
    playerCar.position.set(0, 0, 0);
    scene.add(playerCar);
    
    // ---------------- Create Enemy Cars (Non-Yellow Benz-Style) ----------------
    const enemyCarColors = [0xff073a, 0xff66cc, 0x00ffff, 0xffa500];
    const enemyCars = [];
    const cardinalDirections = [
      new THREE.Vector2(1, 0),
      new THREE.Vector2(-1, 0),
      new THREE.Vector2(0, 1),
      new THREE.Vector2(0, -1)
    ];
    function createEnemyCar(color) {
      const car = createBenzCar();
      // Change the car body color (assume the first mesh with width==3 is the body).
      car.traverse(child => {
        if (child.isMesh && child.geometry.parameters && child.geometry.parameters.width === 3) {
          child.material = child.material.clone();
          child.material.color.set(color);
        }
      });
      const dir = cardinalDirections[Math.floor(Math.random() * cardinalDirections.length)].clone();
      car.userData.direction = dir;
      return car;
    }
    for (let i = 0; i < 4; i++) {
      const enemyCar = createEnemyCar(enemyCarColors[i]);
      enemyCar.position.set((i - 1.5) * 10, 0, -10);
      enemyCar.userData.speed = 0.1 + Math.random() * 0.2;
      enemyCars.push(enemyCar);
      scene.add(enemyCar);
    }
    
    // ---------------- Movement Control for Player's Car ----------------
    let carDirection = new THREE.Vector2(1, 0); // Default: moving right.
    const moveSpeed = 0.2;
    window.addEventListener("keydown", (e) => {
      e.preventDefault();
      switch (e.key) {
        case "ArrowLeft":
          carDirection.set(-1, 0);
          break;
        case "ArrowRight":
          carDirection.set(1, 0);
          break;
        case "ArrowUp":
          carDirection.set(0, -1);
          break;
        case "ArrowDown":
          carDirection.set(0, 1);
          break;
      }
    });
    
    // ---------------- Score & Game Over Handling ----------------
    let score = 0;
    const scoreDisplay = document.getElementById("scoreDisplay");
    let gameOver = false;
    const gameOverPopup = document.getElementById("gameOverPopup");
    document.getElementById("replayButton").addEventListener("click", () => {
      location.reload();
    });
    
    // ---------------- Collision Detection ----------------
    function checkCollision(obj1, obj2, threshold) {
      const dx = obj1.position.x - obj2.position.x;
      const dz = obj1.position.z - obj2.position.z;
      return Math.sqrt(dx * dx + dz * dz) < threshold;
    }
    
    // ---------------- Animation Loop ----------------
    function animate() {
      if (gameOver) return;
      requestAnimationFrame(animate);
      
      // Update player's car movement.
      const newX = playerCar.position.x + carDirection.x * moveSpeed;
      const newZ = playerCar.position.z + carDirection.y * moveSpeed;
      if (isStreet(newX, newZ)) {
        playerCar.position.x = newX;
        playerCar.position.z = newZ;
      }
      const angle = Math.atan2(carDirection.y, carDirection.x) - Math.PI / 2;
      playerCar.rotation.y = angle;
      
      // Check coin collection.
      coinsGroup.children = coinsGroup.children.filter(coin => {
        if (checkCollision(playerCar, coin, 1.5)) {
          score += 10;
          scoreDisplay.innerHTML = "Score: " + score;
          scene.remove(coin);
          return false;
        }
        return true;
      });
      
      // Update enemy cars.
      enemyCars.forEach(enemyCar => {
        const currentDir = enemyCar.userData.direction;
        const potentialX = enemyCar.position.x + currentDir.x * enemyCar.userData.speed;
        const potentialZ = enemyCar.position.z + currentDir.y * enemyCar.userData.speed;
        if (isStreet(potentialX, potentialZ)) {
          enemyCar.position.x = potentialX;
          enemyCar.position.z = potentialZ;
        } else {
          enemyCar.userData.direction = cardinalDirections[Math.floor(Math.random() * cardinalDirections.length)].clone();
        }
        const enemyAngle = Math.atan2(enemyCar.userData.direction.y, enemyCar.userData.direction.x) - Math.PI / 2;
        enemyCar.rotation.y = enemyAngle;
        
        // Check collision with player's car.
        if (checkCollision(playerCar, enemyCar, 2)) {
          gameOver = true;
          gameOverPopup.style.display = "flex";
        }
      });
      
      // Animate fishes.
      fishesGroup.children.forEach(fish => {
        fish.position.x += fish.userData.direction.x * fish.userData.speed;
        fish.position.z += fish.userData.direction.y * fish.userData.speed;
        const seaBoundaryX = seaWidth / 2;
        const seaBoundaryZ = seaDepth / 2;
        if (fish.position.x > seaBoundaryX || fish.position.x < -seaBoundaryX) {
          fish.userData.direction.x *= -1;
        }
        if (fish.position.z > seaBoundaryZ || fish.position.z < -seaBoundaryZ) {
          fish.userData.direction.y *= -1;
        }
      });
      
      // Update camera to follow player's car.
      camera.position.x = playerCar.position.x;
      camera.position.z = playerCar.position.z;
      camera.position.y = 40;
      camera.lookAt(playerCar.position);
      
      renderer.render(scene, camera);
    }
    animate();
    
    // ---------------- Handle Window Resize ----------------
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
    
    // ---------------- Create Sea and Fishes ----------------
    const seaWidth = streetWidth * 1.5;
    const seaDepth = streetDepth * 1.5;
    const seaGeometry = new THREE.PlaneGeometry(seaWidth, seaDepth);
    const seaMaterial = new THREE.MeshPhongMaterial({ color: 0x1e90ff, transparent: true, opacity: 0.8 });
    const sea = new THREE.Mesh(seaGeometry, seaMaterial);
    sea.rotation.x = -Math.PI / 2;
    sea.position.y = -0.5;
    scene.add(sea);
    
    const fishesGroup = new THREE.Group();
    function createFish() {
      const fishGroup = new THREE.Group();
      const bodyGeometry = new THREE.SphereGeometry(0.3, 16, 16);
      const bodyMaterial = new THREE.MeshPhongMaterial({ color: 0xff4500 });
      const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
      body.scale.set(1, 0.6, 1.5);
      fishGroup.add(body);
      const tailGeometry = new THREE.ConeGeometry(0.2, 0.5, 16);
      const tailMaterial = new THREE.MeshPhongMaterial({ color: 0xff4500 });
      const tail = new THREE.Mesh(tailGeometry, tailMaterial);
      tail.rotation.z = Math.PI;
      tail.position.set(0, 0, -0.9);
      fishGroup.add(tail);
      return fishGroup;
    }
    for (let i = 0; i < 10; i++) {
      const fish = createFish();
      fish.position.x = (Math.random() - 0.5) * seaWidth;
      fish.position.z = (Math.random() - 0.5) * seaDepth;
      fish.position.y = -0.3;
      fish.userData.direction = new THREE.Vector2(Math.random() - 0.5, Math.random() - 0.5).normalize();
      fish.userData.speed = 0.02 + Math.random() * 0.03;
      fishesGroup.add(fish);
    }
    scene.add(fishesGroup);
    
  </script>
</body>
</html>
